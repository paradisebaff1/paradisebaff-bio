<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PARADISEbaff</title>
<meta name="description" content="PARADISEbaff — разработчик. Discord-боты, сайты, дизайн, Python.">
<meta property="og:title" content="PARADISEbaff">
<meta property="og:description" content="Discord-боты · Сайты · Дизайн · Python">
<meta name="theme-color" content="#0a0f1a">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--accent:#22D3EE;--accent-2:#0ea5c4;--bg:#0a0f1a;--card:rgba(18,26,42,.62);--stroke:rgba(255,255,255,.08);--txt:#e8eef7;--muted:#8aa0bd}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:"Manrope",system-ui,Arial,sans-serif;color:var(--txt);background:var(--bg);min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:24px 16px;overflow-x:hidden;position:relative}
.bg{position:fixed;inset:0;z-index:0;overflow:hidden;background:radial-gradient(1200px 700px at 50% -10%,rgba(34,211,238,.14),transparent 60%),radial-gradient(900px 600px at 85% 110%,rgba(14,165,196,.12),transparent 60%),var(--bg)}
.bg .watermark{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:22vw;letter-spacing:-.04em;color:rgba(255,255,255,.02);white-space:nowrap;user-select:none}
.bg .grid{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px);background-size:46px 46px;mask-image:radial-gradient(70% 60% at 50% 40%,#000,transparent)}
.orb{position:absolute;border-radius:50%;filter:blur(60px);opacity:.5;animation:float 14s ease-in-out infinite}
.orb.a{width:340px;height:340px;background:#22D3EE;top:-80px;left:-60px}
.orb.b{width:300px;height:300px;background:#0ea5c4;bottom:-90px;right:-50px;animation-delay:-5s}
@keyframes float{0%,100%{transform:translate(0,0)}50%{transform:translate(30px,-26px)}}
.spark{position:absolute;width:3px;height:3px;border-radius:50%;background:var(--accent);box-shadow:0 0 8px var(--accent);opacity:0;animation:rise linear infinite}
@keyframes rise{0%{transform:translateY(20px);opacity:0}10%{opacity:.8}100%{transform:translateY(-110vh);opacity:0}}
.card{position:relative;z-index:1;width:100%;max-width:400px;background:var(--card);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border:1px solid var(--stroke);border-radius:26px;padding:30px 24px 24px;box-shadow:0 30px 80px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.05);animation:in .7s cubic-bezier(.2,.7,.2,1) both}
@keyframes in{from{opacity:0;transform:translateY(16px) scale(.98)}to{opacity:1;transform:none}}
.ava{width:122px;height:122px;margin:6px auto 0;position:relative}
.ava .halo{position:absolute;top:-4px;left:50%;width:72px;height:19px;transform:translateX(-50%) rotateX(68deg);border-radius:50%;border:3px solid rgba(255,244,196,.92);box-shadow:0 0 16px 3px rgba(255,232,150,.55),inset 0 0 8px rgba(255,232,150,.5);animation:halo 6s ease-in-out infinite;z-index:3}
@keyframes halo{0%,100%{transform:translateX(-50%) translateY(0) rotateX(68deg)}50%{transform:translateX(-50%) translateY(-11px) rotateX(68deg)}}
.ava .glow{position:absolute;inset:8px;border-radius:30px;background:radial-gradient(circle,rgba(34,211,238,.5),rgba(255,255,255,.12) 52%,transparent 70%);filter:blur(11px);animation:pulseg 5s ease-in-out infinite;z-index:1}
@keyframes pulseg{0%,100%{opacity:.65;transform:scale(1)}50%{opacity:1;transform:scale(1.07)}}
.ava img{position:absolute;inset:16px;width:90px;height:90px;border-radius:24px;object-fit:cover;z-index:2;box-shadow:0 16px 32px rgba(0,0,0,.45),0 0 22px rgba(34,211,238,.32);animation:floaty 6s ease-in-out infinite}
@keyframes floaty{0%{transform:translateY(0) rotate(-2.5deg)}50%{transform:translateY(-11px) rotate(2.5deg)}100%{transform:translateY(0) rotate(-2.5deg)}}
.ava .dot{position:absolute;right:14px;bottom:14px;width:17px;height:17px;border-radius:50%;background:#22c55e;border:3px solid #0b1220;z-index:4;animation:floaty 6s ease-in-out infinite}
.name{display:flex;align-items:center;justify-content:center;gap:7px;margin-top:16px;font-weight:800;font-size:23px}
.name .vf{width:19px;height:19px;color:var(--accent);flex:none}
.bio{text-align:center;color:var(--muted);font-size:14px;line-height:1.5;margin:8px 16px 0}
.rentline{display:inline-flex;align-items:center;gap:7px;margin:14px auto 0;padding:7px 14px;background:rgba(34,211,238,.1);border:1px solid rgba(34,211,238,.28);border-radius:999px;color:#aef3ff;font-size:12.5px;font-weight:600}
.rentline .pulse{width:8px;height:8px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 0 rgba(34,211,238,.6);animation:pp 2s infinite}
@keyframes pp{0%{box-shadow:0 0 0 0 rgba(34,211,238,.5)}70%{box-shadow:0 0 0 9px rgba(34,211,238,0)}100%{box-shadow:0 0 0 0 rgba(34,211,238,0)}}
.views{display:flex;align-items:center;justify-content:center;gap:6px;margin-top:14px;color:var(--muted);font-size:12.5px}
.views svg{width:15px;height:15px;opacity:.8}
.links{display:flex;flex-direction:column;gap:10px;margin-top:20px}
.btn{display:flex;align-items:center;gap:13px;padding:13px 16px;border-radius:14px;background:rgba(255,255,255,.04);border:1px solid var(--stroke);color:var(--txt);text-decoration:none;font-weight:600;font-size:14.5px;transition:.18s;position:relative;overflow:hidden}
.btn:hover{background:rgba(34,211,238,.1);border-color:rgba(34,211,238,.4);transform:translateY(-2px)}
.btn .ic{width:22px;height:22px;flex:none;display:grid;place-items:center}
.btn .ic svg{width:20px;height:20px}
.btn .lab{line-height:1.15}.btn .bsub{color:var(--muted);font-weight:500;font-size:11.5px;margin-top:1px}
.btn .arr{margin-left:auto;width:17px;height:17px;flex:none;color:var(--muted);transition:.18s}
.btn:hover .arr{color:var(--accent);transform:translateX(3px)}
.btn.primary{background:linear-gradient(90deg,rgba(34,211,238,.22),rgba(14,165,196,.14));border-color:rgba(34,211,238,.45)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.tile{padding:12px;border-radius:13px;background:rgba(255,255,255,.04);border:1px solid var(--stroke);text-decoration:none;color:var(--txt);font-size:13px;font-weight:600;text-align:center;transition:.18s}
.tile:hover{background:rgba(34,211,238,.1);border-color:rgba(34,211,238,.4);transform:translateY(-2px)}
.tile span{display:block;color:var(--muted);font-weight:500;font-size:11px;margin-top:2px}
.player{margin-top:16px;padding:12px;border-radius:16px;background:rgba(255,255,255,.04);border:1px solid var(--stroke);position:relative}
.ptop{display:flex;align-items:center;gap:12px}
.pcover{width:46px;height:46px;border-radius:10px;object-fit:cover;flex:none;box-shadow:0 6px 16px rgba(0,0,0,.4);transition:box-shadow .3s}
.covwrap{position:relative;width:46px;height:46px;flex:none}
.eq{position:absolute;inset:0;display:none;align-items:flex-end;justify-content:center;gap:3px;padding:9px 8px;background:rgba(6,16,26,.5);border-radius:10px}
.player.playing .eq{display:flex}
.player.playing .pcover{box-shadow:0 6px 22px rgba(34,211,238,.45)}
.eq span{width:3px;height:5px;background:var(--accent);border-radius:2px;animation:eq .9s ease-in-out infinite}
.eq span:nth-child(2){animation-delay:.15s}.eq span:nth-child(3){animation-delay:.3s}.eq span:nth-child(4){animation-delay:.45s}
@keyframes eq{0%,100%{height:5px}50%{height:22px}}
.plmenu{position:absolute;top:11px;right:11px;width:30px;height:30px;border:1px solid var(--stroke);border-radius:9px;background:rgba(255,255,255,.04);color:var(--muted);display:grid;place-items:center;cursor:pointer;transition:.15s;z-index:3}
.plmenu:hover{color:var(--accent)}
.plmenu svg{width:16px;height:16px}
.player.listopen .plmenu{color:#06121a;background:var(--accent);border-color:transparent}
.ptop{padding-right:34px}
.plist{max-height:0;overflow:hidden;transition:max-height .32s ease}
.player.listopen .plist{max-height:260px;overflow-y:auto;margin-top:12px}
.pitem{display:flex;align-items:center;gap:10px;padding:6px;border-radius:10px;cursor:pointer;transition:.14s}
.pitem:hover{background:rgba(255,255,255,.05)}
.pitem.cur{background:rgba(34,211,238,.1)}
.pitem img{width:34px;height:34px;border-radius:7px;object-fit:cover;flex:none}
.pitem .pi-m{min-width:0;flex:1}
.pitem .pi-t{font-size:12.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pitem.cur .pi-t{color:var(--accent)}
.pitem .pi-a{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pitem .pi-eq{display:none;gap:2px;align-items:flex-end;height:14px;flex:none;margin-right:4px}
.pitem.cur .pi-eq{display:flex}
.pitem .pi-eq span{width:2.5px;height:3px;background:var(--accent);border-radius:1px}
.player.playing .pitem.cur .pi-eq span{animation:eqm .9s ease-in-out infinite}
.player.playing .pitem.cur .pi-eq span:nth-child(2){animation-delay:.15s}
.player.playing .pitem.cur .pi-eq span:nth-child(3){animation-delay:.3s}
@keyframes eqm{0%,100%{height:3px}50%{height:13px}}
.pmeta{min-width:0;flex:1}
.ptitle{font-weight:700;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.partist{color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pplay{width:40px;height:40px;border:none;border-radius:50%;flex:none;cursor:pointer;background:var(--accent);color:#06121a;display:grid;place-items:center;transition:.15s;box-shadow:0 6px 18px rgba(34,211,238,.4)}
.pplay:hover{transform:scale(1.06)}
.pplay svg{width:18px;height:18px}
.pctrls{display:flex;align-items:center;justify-content:center;gap:18px;margin-top:14px}
.pvol{display:flex;align-items:center;gap:10px;margin-top:13px;padding:0 2px}
.pvol .volic{width:17px;height:17px;color:var(--muted);flex:none}
#vol{-webkit-appearance:none;appearance:none;flex:1;height:5px;border-radius:5px;background:rgba(255,255,255,.12);cursor:pointer;outline:none}
#vol::-webkit-slider-thumb{-webkit-appearance:none;width:13px;height:13px;border-radius:50%;background:var(--accent);box-shadow:0 0 8px var(--accent);cursor:pointer}
#vol::-moz-range-thumb{width:13px;height:13px;border:none;border-radius:50%;background:var(--accent);box-shadow:0 0 8px var(--accent);cursor:pointer}
.pnav{width:30px;height:30px;border:none;border-radius:50%;flex:none;cursor:pointer;background:rgba(255,255,255,.06);color:var(--txt);display:grid;place-items:center;transition:.15s}
.pnav:hover{background:rgba(34,211,238,.15);color:var(--accent)}
.pnav svg{width:14px;height:14px}
.pbar{display:flex;align-items:center;gap:9px;margin-top:11px}
.ptime{font-size:10.5px;color:var(--muted);font-variant-numeric:tabular-nums;min-width:30px;text-align:center}
.ptrack{flex:1;height:5px;border-radius:5px;background:rgba(255,255,255,.1);position:relative;cursor:pointer}
.pfill{position:absolute;left:0;top:0;bottom:0;width:0;border-radius:5px;background:var(--accent)}
.pfill::after{content:"";position:absolute;right:-5px;top:50%;transform:translateY(-50%);width:11px;height:11px;border-radius:50%;background:#fff;box-shadow:0 0 8px var(--accent)}
.foot{text-align:center;color:var(--muted);font-size:11px;margin-top:18px;opacity:.7}
.foot a{color:var(--muted);text-decoration:none}
@media(max-width:380px){.card{padding:26px 18px 20px}.name{font-size:21px}}
.intro{position:fixed;inset:0;z-index:999;display:flex;align-items:center;justify-content:center;background:rgba(6,11,20,.97);backdrop-filter:blur(6px);cursor:pointer;transition:opacity .6s ease,visibility .6s}
.intro.hide{opacity:0;visibility:hidden;pointer-events:none}
.intro-inner{text-align:center;display:flex;flex-direction:column;align-items:center;gap:18px;animation:in .6s ease both}
.intro-logo{position:relative;width:96px;height:96px}
.intro-logo img{position:absolute;inset:13px;width:70px;height:70px;border-radius:20px;box-shadow:0 0 22px rgba(34,211,238,.4);animation:floaty 5s ease-in-out infinite}
.ispin{position:absolute;inset:0;border-radius:50%;border:2px solid transparent;border-top-color:var(--accent);border-right-color:var(--accent);animation:ispin 1s linear infinite;filter:drop-shadow(0 0 7px var(--accent));transition:opacity .4s}
@keyframes ispin{to{transform:rotate(360deg)}}
.intro-name{font-weight:800;font-size:22px;letter-spacing:.5px}
.intro-bar{width:180px;height:4px;border-radius:4px;background:rgba(255,255,255,.1);overflow:hidden}
.intro-fill{height:100%;width:0;background:linear-gradient(90deg,var(--accent),#7af5ff);transition:width .18s linear}
.intro-hint{font-size:13px;color:var(--muted);min-height:18px}
.intro.ready .ispin{opacity:0}
.intro.ready .intro-hint{color:var(--accent);font-weight:600;animation:hintp 1.6s ease-in-out infinite}
@keyframes hintp{0%,100%{opacity:.55}50%{opacity:1}}
</style>
</head>

audio.addEventListener('pause',()=>{iplay.style.display='block';ipause.style.display='none';player.classList.remove('playing')});
const vol=document.getElementById('vol');
function setVol(v){audio.volume=v;vol.style.background=`linear-gradient(to right,var(--accent) ${v*100}%,rgba(255,255,255,.12) ${v*100}%)`;}
vol.addEventListener('input',()=>setVol(+vol.value));
setVol(0.7);
pp.addEventListener('click',()=>{audio.paused?audio.play().catch(()=>{}):audio.pause()});
track.addEventListener('click',e=>{const r=track.getBoundingClientRect();audio.currentTime=(e.clientX-r.left)/r.width*audio.duration});
const bg=document.querySelector('.bg');for(let i=0;i<14;i++){const s=document.createElement('div');s.className='spark';s.style.left=Math.random()*100+'%';s.style.animationDuration=(6+Math.random()*8)+'s';s.style.animationDelay=(-Math.random()*10)+'s';bg.appendChild(s);}
(async()=>{try{const u=`https://api.counterapi.dev/v1/${CONFIG.viewsNamespace}/${CONFIG.viewsKey}/up`;const r=await fetch(u);const j=await r.json();if(j&&j.count!=null)document.getElementById('views').textContent=j.count.toLocaleString('ru-RU');else throw 0;}catch(e){document.querySelector('.views').style.display='none';}})();
// ---- экран входа + автозапуск музыки по клику ----
(()=>{
  const intro=document.getElementById('intro');
  const av=document.querySelector('.ava img'); if(av) document.querySelector('.intro-logo img').src=av.src;
  let entered=false,p=0;
  const fill=document.getElementById('ifill');
  const t=setInterval(()=>{p+=8+Math.random()*15;if(p>=100){p=100;clearInterval(t);ready();}fill.style.width=Math.min(p,100)+'%';},130);
  function ready(){intro.classList.add('ready');document.getElementById('ihint').textContent='Нажмите в любое место';}
  function enter(){if(entered||!intro.classList.contains('ready'))return;entered=true;intro.classList.add('hide');try{audio.currentTime=0;audio.play().catch(()=>{});}catch(e){}}
  intro.addEventListener('click',enter);
  window.addEventListener('keydown',enter);
})();
</script>
</body>
</html>
